<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="profile-card">
    <div class="profile-banner"></div>
    <div class="profile-body">
      <div class="profile-avatar-wrapper">
        <div class="profile-avatar-placeholder">JD</div>
      </div>
      <h1 class="profile-name">Jane Doe</h1>
      <p class="profile-username">@janedoe</p>
      <p class="profile-bio">
        Full-stack developer passionate about building great user experiences.
        Open-source contributor and coffee enthusiast ☕
      </p>
      <div class="profile-stats">
        <div class="stat-item">
          <span class="stat-value">128</span>
          <span class="stat-label">Posts</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">4.2k</span>
          <span class="stat-label">Followers</span>
        </div>
        <div class="stat-item">
          <span class="stat-value">312</span>
          <span class="stat-label">Following</span>
        </div>
      </div>
      <div class="profile-actions">
        <button class="btn btn-primary">Follow</button>
        <button class="btn btn-secondary">Message</button>
      </div>
    </div>
  </div>
</body>
</html>
